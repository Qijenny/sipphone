name: Build Android APK (Python 3.12, Android 7.1)

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Verify Python and cgi
      run: |
        python --version
        python -c "import cgi; print('cgi OK')"

    - name: Set up Java 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Clear cache
      run: rm -rf ~/.buildozer .buildozer

    - name: Install dependencies and buildozer
      run: |
        sudo apt-get update
        sudo apt-get install -y git zip unzip python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev
        pip install --upgrade pip
        pip install buildozer "cython<3.0" pillow

    - name: Modify buildozer.spec for Python 3.12 + Android 7.1
      run: |
        if [ -f buildozer.spec ]; then
            sed -i 's/python3==3.11.12/python3==3.12.4/g' buildozer.spec
            sed -i 's/python3==3.12.5/python3==3.12.4/g' buildozer.spec
            sed -i 's/hostpython3==3.11.12/hostpython3==3.12.4/g' buildozer.spec
            sed -i 's/hostpython3==3.12.5/hostpython3==3.12.4/g' buildozer.spec
            sed -i 's/^android.minapi = .*/android.minapi = 21/' buildozer.spec
            sed -i 's/^android.api = .*/android.api = 33/' buildozer.spec
            sed -i 's/^android.ndk_api = .*/android.ndk_api = 21/' buildozer.spec
            grep -q "^android.minapi" buildozer.spec || echo "android.minapi = 21" >> buildozer.spec
            grep -q "^android.api" buildozer.spec || echo "android.api = 33" >> buildozer.spec
            grep -q "^android.ndk_api" buildozer.spec || echo "android.ndk_api = 21" >> buildozer.spec
            echo "--- requirements ---"
            grep "^requirements" buildozer.spec
            echo "--- android settings ---"
            grep -E "^android\." buildozer.spec | head -10
        fi

    - name: Setup Android SDK
      run: |
        export ANDROID_HOME="$HOME/.buildozer/android/platform/android-sdk"
        export ANDROID_SDK_ROOT="$ANDROID_HOME"
        mkdir -p $ANDROID_HOME/cmdline-tools
        cd $ANDROID_HOME/cmdline-tools
        rm -rf cmdline-tools latest
        wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
        unzip -q commandlinetools-linux-11076708_latest.zip
        mv cmdline-tools latest
        rm commandlinetools-linux-11076708_latest.zip
        mkdir -p $ANDROID_HOME/tools/bin
        ln -sf $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager $ANDROID_HOME/tools/bin/sdkmanager
        export PATH="$PATH:$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/tools/bin:$ANDROID_HOME/platform-tools"
        yes | sdkmanager --licenses
        sdkmanager "platform-tools" "platforms;android-25" "platforms;android-33" "build-tools;33.0.0"

    - name: Build APK
      run: |
        export ANDROID_HOME="$HOME/.buildozer/android/platform/android-sdk"
        export ANDROID_SDK_ROOT="$ANDROID_HOME"
        export PATH="$PATH:$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/tools/bin:$ANDROID_HOME/platform-tools"
        export BUILDOZER_WARN_ON_ROOT=0
        
        buildozer -v android debug 2>&1 | tee build.log
        BUILD_EXIT=${PIPESTATUS[0]}
        
        echo ""
        echo "=== Build exit code: $BUILD_EXIT ==="
        find . -name "*.apk" -type f 2>/dev/null
        
        APK_COUNT=$(find . -name "*.apk" -type f 2>/dev/null | wc -l)
        echo "Found $APK_COUNT APK files"
        
        if [ $BUILD_EXIT -ne 0 ]; then
          echo "Build failed!"
          exit 1
        fi
        
        if [ $APK_COUNT -eq 0 ]; then
          echo "No APK found!"
          exit 1
        fi
      timeout-minutes: 90

    - name: Upload build log
      uses: actions/upload-artifact@v4
      with:
        name: build-log
        path: build.log
      if: always()

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: sipphone-debug
        path: '**/*.apk'
        if-no-files-found: error
      if: always()
