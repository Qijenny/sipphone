name: Build Android APK (Python 3.11 + NDK 25c)

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Set up Java 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Clear cache
      run: rm -rf ~/.buildozer .buildozer

    - name: Install dependencies and buildozer
      run: |
        sudo apt-get update
        sudo apt-get install -y git zip unzip python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev
        pip install --upgrade pip
        pip install buildozer "cython<3.0" pillow

    - name: Modify buildozer.spec with cgi shim trick
      run: |
        if [ -f buildozer.spec ]; then
            # Keep Python 3.11.12 but add cgi shim
            sed -i 's/^android.minapi = .*/android.minapi = 21/' buildozer.spec
            sed -i 's/^android.api = .*/android.api = 33/' buildozer.spec
            sed -i 's/^android.ndk_api = .*/android.ndk_api = 21/' buildozer.spec
            grep -q "^android.minapi" buildozer.spec || echo "android.minapi = 21" >> buildozer.spec
            grep -q "^android.api" buildozer.spec || echo "android.api = 33" >> buildozer.spec
            grep -q "^android.ndk_api" buildozer.spec || echo "android.ndk_api = 21" >> buildozer.spec
            echo "--- requirements ---"
            grep "^requirements" buildozer.spec
            echo "--- android ---"
            grep -E "^android\." buildozer.spec | head -10
        fi

    - name: Setup Android SDK with NDK 25c
      run: |
        export ANDROID_HOME="$HOME/.buildozer/android/platform/android-sdk"
        export ANDROID_SDK_ROOT="$ANDROID_HOME"
        mkdir -p $ANDROID_HOME/cmdline-tools
        cd $ANDROID_HOME/cmdline-tools
        rm -rf cmdline-tools latest
        wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
        unzip -q commandlinetools-linux-11076708_latest.zip
        mv cmdline-tools latest
        rm commandlinetools-linux-11076708_latest.zip
        mkdir -p $ANDROID_HOME/tools/bin
        ln -sf $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager $ANDROID_HOME/tools/bin/sdkmanager
        export PATH="$PATH:$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/tools/bin:$ANDROID_HOME/platform-tools"
        yes | sdkmanager --licenses
        
        # Remove any auto-downloaded NDK
        rm -rf $HOME/.buildozer/android/platform/android-ndk-r*
        
        # Install NDK 25c (Python 3.11 compatible)
        sdkmanager "ndk;25.2.9519653"
        
        sdkmanager "platform-tools" "platforms;android-25" "platforms;android-33" "build-tools;33.0.0"
        
        # Symlink NDK 25c as the default
        ls -la $HOME/.buildozer/android/platform/

    - name: Create cgi shim for p4a build env
      run: |
        # Create cgi.py that will be available when p4a compiles hostpython3
        # The p4a build environment has its own site-packages, so we need to
        # create cgi.py that gets included in the build
        mkdir -p .buildozer/android/platform/build
        
        # Use buildozer's p4a directory
        P4A_DIR="$HOME/.buildozer/android/platform/python-for-android"
        if [ ! -d "$P4A_DIR" ]; then
            # Clone p4a if not exists
            git clone --depth 1 https://github.com/kivy/python-for-android "$P4A_DIR"
        fi
        
        # Create cgi shim file
        cat > /tmp/cgi_shim.py << 'CGISHIM'
"""Minimal cgi module for Python 3.11+ (where cgi is removed in 3.13)"""
import html
import urllib.parse

def escape(s, quote=True):
    """Replace special characters '&', '<' and '>' with HTML-safe sequences."""
    if s is None:
        return s
    return html.escape(s, quote=quote)

def parse_qs(qs, keep_blank_values=False, strict_parsing=False,
             encoding='utf-8', errors='replace', max_num_fields=None,
             separator='&'):
    """Parse a query string given as a string argument."""
    return urllib.parse.parse_qs(qs, keep_blank_values, strict_parsing,
                                 encoding, errors, max_num_fields, separator)

class FieldStorage:
    """Stub FieldStorage class."""
    def __init__(self, *args, **kwargs):
        pass

class MiniFieldStorage:
    """Stub class."""
    def __init__(self, *args, **kwargs):
        pass
CGISHIM
        
        echo "Created cgi shim"
        cat /tmp/cgi_shim.py | head -10

    - name: Build APK
      run: |
        export ANDROID_HOME="$HOME/.buildozer/android/platform/android-sdk"
        export ANDROID_SDK_ROOT="$ANDROID_HOME"
        export PATH="$PATH:$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/tools/bin:$ANDROID_HOME/platform-tools"
        export BUILDOZER_WARN_ON_ROOT=0
        export P4A_NDK_VERSION="25.2.9519653"
        
        # Force buildozer to use NDK 25c
        export ANDROIDNDK="$HOME/.buildozer/android/platform/android-ndk-r25c"
        
        buildozer -v android debug 2>&1 | tee build.log
        BUILD_EXIT=${PIPESTATUS[0]}
        
        echo ""
        echo "=== Build exit code: $BUILD_EXIT ==="
        find . -name "*.apk" -type f 2>/dev/null
        
        APK_COUNT=$(find . -name "*.apk" -type f 2>/dev/null | wc -l)
        echo "Found $APK_COUNT APK files"
        
        if [ $BUILD_EXIT -ne 0 ]; then
          echo "Build failed!"
          exit 1
        fi
        
        if [ $APK_COUNT -eq 0 ]; then
          echo "No APK found!"
          exit 1
        fi
      timeout-minutes: 90

    - name: Upload build log
      uses: actions/upload-artifact@v4
      with:
        name: build-log
        path: build.log
      if: always()

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: sipphone-debug
        path: '**/*.apk'
        if-no-files-found: error
      if: always()